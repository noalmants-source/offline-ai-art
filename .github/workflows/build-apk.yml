name: Compilar APK de IA Offline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar Repositorio Principal
      uses: actions/checkout@v4

    - name: Instalar Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configurar Android SDK y NDK
      uses: android-actions/setup-android@v3
      # Esta acción instala automáticamente la SDK básica de Android

    - name: Instalar Android NDK y CMake
      run: |
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Clonar stable-diffusion.cpp (IA local)
      run: |
        git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git app/src/main/cpp/stable-diffusion.cpp

    - name: Generar Gradle Wrapper en la Nube
      run: gradle wrapper

    - name: Asegurar Ejecución de Gradle Wrapper
      run: chmod +x gradlew

    - name: Compilar APK de Lanzamiento (Release)
      run: |
        ./gradlew assembleRelease --stacktrace


    - name: Subir Instalador APK Compilado
      uses: actions/upload-artifact@v3
      with:
        name: OfflineAIArt-Release-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
