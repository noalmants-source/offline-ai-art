name: Compilar APK de IA Offline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar Repositorio Principal
      uses: actions/checkout@v4

    - name: Instalar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configurar Android SDK y NDK
      uses: android-actions/setup-android@v4
      # Esta acción instala automáticamente la SDK básica de Android

    - name: Instalar Android NDK y CMake
      run: |
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Clonar stable-diffusion.cpp (IA local)
      run: |
        git clone --recursive https://github.com/leejet/stable-diffusion.cpp.git app/src/main/cpp/stable-diffusion.cpp

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Compilar APK de Lanzamiento (Release)
      run: |
        gradle assembleRelease --stacktrace

    - name: Rename APK for release
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/ArteIAOffline.apk

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0
        name: Release v1.0.0
        files: app/build/outputs/apk/release/ArteIAOffline.apk
        token: ${{ secrets.GITHUB_TOKEN }}
